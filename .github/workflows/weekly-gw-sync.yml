name: Weekly GW sync and price refresh

on:
  schedule:
    # 16:30 UTC Sunday = 2:30am AEST Monday — picks up the week's GW releases
    - cron: "30 16 * * 0"
  workflow_dispatch: {}

env:
  BASE: https://www.spycy.fun

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check credentials are configured
        run: |
          if [ -z "${{ secrets.PRICEHAMMER_ADMIN_USER }}" ] || [ -z "${{ secrets.PRICEHAMMER_ADMIN_PASS }}" ]; then
            echo "::error::Repo secrets PRICEHAMMER_ADMIN_USER and PRICEHAMMER_ADMIN_PASS are not set. Add them under Settings -> Secrets and variables -> Actions -> New repository secret, using the same values as ADMIN_USER / ADMIN_PASS on Render. Every step in this workflow will fail with 'unauthorized' until they exist."
            exit 1
          fi
          echo "credentials present"

      # Each job is started in the background on the server (async=1 -> HTTP
      # 202 + job id) and polled with short requests, so no single request
      # lives long enough for Render's proxy to cut it. Starting retries with
      # backoff because Render serves an HTML error page mid-deploy; a job
      # lost to a redeploy (poll -> 404) is simply restarted.
      - name: Write job helper
        run: |
          cat > run-job.sh <<'SH'
          #!/usr/bin/env bash
          # usage: run-job.sh <label> <path-with-query>
          set -uo pipefail
          label="$1"; path="$2"; auth="$ADMIN_USER:$ADMIN_PASS"
          for attempt in 1 2 3 4 5; do
            HTTP=$(curl -sS -m 60 -u "$auth" -X POST "$BASE$path" -o start.json -w "%{http_code}") || HTTP=000
            JOB=$(jq -r '.jobId // empty' start.json 2>/dev/null)
            if [ "$HTTP" != "202" ] || [ -z "$JOB" ]; then
              echo "$label start attempt $attempt failed (HTTP $HTTP):"; head -c 300 start.json 2>/dev/null; echo
              sleep $((attempt * 45)); continue
            fi
            echo "$label job $JOB started"
            route="${path%%\?*}"
            for i in $(seq 1 240); do   # up to 2h at 30s
              sleep 30
              PH=$(curl -sS -m 30 -u "$auth" "$BASE$route?job=$JOB" -o poll.json -w "%{http_code}") || PH=000
              [ "$PH" = "404" ] && { echo "$label job lost (redeploy?), restarting"; continue 2; }
              [ "$PH" = "200" ] || { echo "poll HTTP $PH, retrying"; continue; }
              STATUS=$(jq -r '.job.status' poll.json)
              case "$STATUS" in
                running) echo "$label still running ($((i * 30))s)";;
                done) echo "$label ok"; jq -c '.job.result' poll.json | head -c 1500; echo; exit 0;;
                *) echo "::error::$label failed: $(jq -r '.job.error' poll.json)"; exit 1;;
              esac
            done
            echo "::error::$label timed out waiting"; exit 1
          done
          echo "::error::$label could not be started after 5 attempts"; exit 1
          SH
          chmod +x run-job.sh

      - name: Sync GW catalogue (add new releases)
        env:
          ADMIN_USER: ${{ secrets.PRICEHAMMER_ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.PRICEHAMMER_ADMIN_PASS }}
        run: ./run-job.sh sync "/api/admin/sync-gw-catalogue?apply=1&async=1"

      - name: Auto-validate new pairs across sellers
        env:
          ADMIN_USER: ${{ secrets.PRICEHAMMER_ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.PRICEHAMMER_ADMIN_PASS }}
        run: ./run-job.sh auto-validate "/api/auto-validate?async=1"

      # Price refreshing is deliberately NOT done here. Building every store's
      # full feed index is CPU/memory heavy and browns out the small Render
      # instance while it runs. Prices are refreshed from a local
      # machine instead (same pattern as the recession collector):
      #   npm run dev          (in one terminal)
      #   npm run refresh:prices
      # which runs the refresh locally and pushes results to prod via
      # /api/admin/prices-import.
      - name: Price refresh reminder
        run: echo "Prices refresh locally now - run npm run refresh:prices on the dev machine. This workflow only syncs the catalogue and auto-validates."
